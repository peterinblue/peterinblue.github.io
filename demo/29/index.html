// ============================================================

function makeTextTexture(text, {
  width = 512, height = 128, fontSize = 64,
  bgColor = '#1a3a8a', textColor = '#ffffff',
  fontFamily = 'Arial Black, PingFang SC, Microsoft YaHei, sans-serif',
  bold = true
} = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = textColor;
  ctx.font = `${bold ? 'bold ' : ''}${fontSize}px ${fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeTileTexture(color1 = '#eaeaea', color2 = '#d8d8d8', size = 8, tileSize = 64) {
  const canvas = document.createElement('canvas');
  canvas.width = tileSize * size; canvas.height = tileSize * size;
  const ctx = canvas.getContext('2d');
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      ctx.fillStyle = ((x + y) % 2 === 0) ? color1 : color2;
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
  }
  // 缝隙
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
  for (let i = 0; i <= size; i++) {
    ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, size * tileSize); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(size * tileSize, i * tileSize); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(STORE.w / 4, STORE.d / 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makePriceTag(price, label = '') {
  const canvas = document.createElement('canvas');
  canvas.width = 160; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 64);
  ctx.fillStyle = '#1a3a8a'; ctx.fillRect(0, 0, 160, 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label || 'LAWSON', 8, 10);
  ctx.fillStyle = '#e84040'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'right';
  ctx.fillText(`¥${price.toFixed(2)}`, 152, 46);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 盆栽（店外左侧）
function makePlant(x, z) {
  const g = new THREE.Group();
  // 花盆
  const pot = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.5, 0.6),
    new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.7 })
  );
  pot.position.y = 0.25; pot.castShadow = true;
  g.add(pot);
  // 树干
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.07, 0.7, 8),
    new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.9 })
  );
  trunk.position.y = 0.85; trunk.castShadow = true;
  g.add(trunk);
  // 树冠（多个球体）
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a8a3a, roughness: 0.8 });
  for (let i = 0; i < 5; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.15, 8, 8), leafMat);
    leaf.position.set(
      (Math.random() - 0.5) * 0.5,
      1.2 + Math.random() * 0.3,
      (Math.random() - 0.5) * 0.5
    );
    leaf.castShadow = true;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  return g;
}

// ============================================================
// 货架生成辅助函数
// ============================================================
function makeMetalShelf({ w = 3, h = 2.2, d = 0.8, levels = 5, frameColor = 0xcccccc, shelfColor = 0xffffff }) {
  const g = new THREE.Group();
  // 框架（四个立柱）
  const frameMat = new THREE.MeshStandardMaterial({ color: frameColor, metalness: 0.6, roughness: 0.4 });
  const legGeo = new THREE.BoxGeometry(0.04, h, 0.04);
  const ox = w / 2 - 0.02, oz = d / 2 - 0.02;
  [[-ox, -oz], [-ox, oz], [ox, -oz], [ox, oz]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, frameMat);
    leg.position.set(x, h / 2, z);
    leg.castShadow = true; leg.receiveShadow = true;
    g.add(leg);
  });
  // 层板
  const shelfMat = new THREE.MeshStandardMaterial({ color: shelfColor, roughness: 0.5 });
  for (let i = 0; i < levels; i++) {
    const y = (h / levels) * (i + 0.5);
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, 0.04, d - 0.04), shelfMat);
    shelf.position.set(0, y, 0);
    shelf.castShadow = true; shelf.receiveShadow = true;
    g.add(shelf);
    // 层板前缘挡板
    const frontStop = new THREE.Mesh(
      new THREE.BoxGeometry(w - 0.04, 0.06, 0.03),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.5 })
    );
    frontStop.position.set(0, y + 0.02, -d / 2 + 0.02);
    g.add(frontStop);
  }
  g.userData.bbox = { w, h, d };
  return g;
}

function makeWoodShelf({ w = 3, h = 2.2, d = 0.9, levels = 4 }) {
  const g = new THREE.Group();
  const woodMat = new THREE.MeshStandardMaterial({ color: S.woodColor, roughness: 0.8 });
  const woodLightMat = new THREE.MeshStandardMaterial({ color: S.woodLight, roughness: 0.7 });
  // 侧板
  const sideGeo = new THREE.BoxGeometry(0.05, h, d);
  const left = new THREE.Mesh(sideGeo, woodMat);
  left.position.set(-w / 2, h / 2, 0); left.castShadow = true;
  g.add(left);
  const right = new THREE.Mesh(sideGeo, woodMat);
  right.position.set(w / 2, h / 2, 0); right.castShadow = true;
  g.add(right);
  // 背板
  const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), woodMat);
  back.position.set(0, h / 2, -d / 2);
  g.add(back);
  // 层板
  for (let i = 0; i < levels; i++) {
    const y = (h / levels) * (i + 0.5);
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(w - 0.08, 0.04, d - 0.04), woodLightMat);
    shelf.position.set(0, y, 0);
    shelf.castShadow = true; shelf.receiveShadow = true;
    g.add(shelf);
  }
  g.userData.bbox = { w, h, d };
  return g;
}

const PRODUCTS = []; // 收集所有可交互商品

function addProduct(mesh, info) {
  mesh.userData.isProduct = true;
  mesh.userData.info = info;
  mesh.castShadow = true; mesh.receiveShadow = true;
  PRODUCTS.push(mesh);
  return mesh;
}

// --- 中间两排饮料货架 ---
function buildDrinkShelf(xOffset, zPos, rotateY = 0) {
  const shelf = makeMetalShelf({ w: 5, h: 2.4, d: 0.7, levels: 5 });
  shelf.position.set(xOffset, 0, zPos);
  shelf.rotation.y = rotateY;
  shelfGroup.add(shelf);

  // 在每层放不同饮料
  const drinkTypes = [
    { make: makeMilkCarton, name: '纯牛奶', price: 8.0, cat: 'DAILY', colorTag: '白' },
    { make: makeJuiceBottle, name: '橙汁', price: 12.0, cat: 'SNACKS', colorTag: '橙' },
    { make: makeTeaBottle, name: '茉莉清茶', price: 5.0, cat: 'SNACKS', colorTag: '绿' },
    { make: makeCoffeeBottle, name: '瓶装咖啡', price: 6.5, cat: 'SNACKS', colorTag: '棕' },
    { make: makeWaterBottle, name: '矿泉水', price: 3.0, cat: 'DAILY', colorTag: '蓝' },
  ];

  const levels = 5;
  const shelfY = 2.4;
  for (let l = 0; l < levels; l++) {
    const y = (shelfY / levels) * (l + 0.5) + 0.05;
    const type = drinkTypes[l % drinkTypes.length];
    // 每排放8个
    for (let i = 0; i < 8; i++) {
      const drink = type.make();
      drink.scale.setScalar(0.9);
      const localX = -2.2 + i * 0.56;
      // 考虑旋转
      const cos = Math.cos(rotateY), sin = Math.sin(rotateY);
      const wx = xOffset + localX * cos;
      const wz = zPos + localX * sin;
      drink.position.set(wx, y, wz);
      drink.rotation.y = rotateY + Math.PI;
      addProduct(drink, { name: type.name, price: type.price, category: type.cat });
      shelfGroup.add(drink);
    }
    // 价格标签（Sprite）
    const priceSpriteMat = new THREE.SpriteMaterial({
      map: makePriceTag(type.price, type.cat), transparent: true
    });
    const priceSprite = new THREE.Sprite(priceSpriteMat);
    priceSprite.scale.set(0.5, 0.2, 1);
    const cos = Math.cos(rotateY), sin = Math.sin(rotateY);
    priceSprite.position.set(
      xOffset + (STORE.w / 2 - 0.5) * -sin,
      y,
      zPos + (STORE.w / 2 - 0.5) * cos + 0.38 * (rotateY === 0 ? 1 : -1)
    );
    // 修正位置 - 放在层板前端
    priceSprite.position.copy(shelf.position);
    priceSprite.position.y = y;
    priceSprite.position.x += (-Math.sin(rotateY)) * 2.45;
    priceSprite.position.z += (Math.cos(rotateY)) * 0.38;
    // 让标签始终面向外侧
    priceSprite.rotation.y = 0; // Sprite 永远面向相机，无需旋转
    shelfGroup.add(priceSprite);
  }
}

// ============================================================
// 商品点击交互
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// 悬浮提示 DOM
const tooltip = document.createElement('div');
Object.assign(tooltip.style, {
  position: 'fixed', display: 'none',
  background: 'rgba(0,0,0,0.85)', color: '#fff',
  padding: '8px 14px', borderRadius: '8px',
  fontSize: '14px', pointerEvents: 'none', zIndex: 50,
  backdropFilter: 'blur(6px)', border: '1px solid rgba(255,255,255,0.15)',
  transition: 'opacity 0.15s'
});
document.body.appendChild(tooltip);

let hoveredProduct = null;

function onMouseMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  // 检测 PRODUCTS 数组里的 mesh 以及它们的子对象
  const allMeshes = [];
  PRODUCTS.forEach(p => {
    p.traverse(c => { if (c.isMesh) allMeshes.push(c); });
  });
  // 也检测设备组
  serviceGroup.traverse(c => { if (c.isMesh && c.parent && c.parent.userData && c.parent.userData.name) allMeshes.push(c); });

  const intersects = raycaster.intersectObjects(allMeshes, false);

  if (intersects.length > 0) {
    // 找到根级的 product 或 device
    let obj = intersects[0].object;
    let root = obj;
    while (root.parent && root.parent !== scene) {
      if (root.userData.isProduct || (root.parent && root.parent.userData && root.parent.userData.name && !root.parent.isGroup === false)) break;
      root = root.parent;
    }
    // 或者往上找带 info 的
    let info = null;
    let cur = intersects[0].object;
    while (cur) {
      if (cur.userData && cur.userData.info) { info = cur.userData.info; break; }
      if (cur.userData && cur.userData.name && cur.parent === serviceGroup) {
        info = { name: cur.userData.name, category: cur.userData.category, price: cur.userData.price }; break;
      }
      cur = cur.parent;
    }

    if (info) {
      tooltip.style.display = 'block';
      tooltip.style.left = e.clientX + 15 + 'px';
      tooltip.style.top = e.clientY + 15 + 'px';
      tooltip.innerHTML = `<strong>${info.name}</strong>` +
        (info.category ? ` <span style="color:#aaa">· ${info.category}</span>` : '') +
        (info.price ? `<br><span style="color:#ffcc66">¥${info.price.toFixed(2)}</span>` : '');
      document.body.style.cursor = 'pointer';
    } else {
      tooltip.style.display = 'none';
      document.body.style.cursor = 'default';
    }
  } else {
    tooltip.style.display = 'none';
    document.body.style.cursor = 'default';
  }
}
window.addEventListener('mousemove', onMouseMove);

// ============================================================
// 渲染循环
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // 星星轻微旋转
  stars.rotation.y += 0.0003;
  renderer.render(scene, camera);
}

  animate();
}, 400);

// ============================================================
// 初始相机动画（从外部推近）
// ============================================================
const startPos = new THREE.Vector3(-14, 12, 22);
const midPos = new THREE.Vector3(-6, 6, 12);
const endPos = new THREE.Vector3(4, 4, 10);
let t = 0;
function introCamera() {
  if (t >= 1) return;
  t = Math.min(1, t + 0.006);
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  // 两段插值
  const p1 = startPos.clone().lerp(midPos, ease);
  const p2 = midPos.clone().lerp(endPos, ease);
  camera.position.copy(p1.lerp(p2, 0));
  camera.position.lerpVectors(startPos, midPos, ease);
  controls.target.set(0, 2.5, 0);
  requestAnimationFrame(introCamera);
}
// 延迟启动，让场景先加载
setTimeout(() => { t = 0; introCamera(); }, 500);
